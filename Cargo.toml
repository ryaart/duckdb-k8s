[package]
name = "k8s"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
strip = true

[dependencies]
duckdb = { version = "~1.10505.0", features = ["loadable-extension"] }
duckdb-tables = { git = "https://github.com/ryaart/duckdb-tables", branch = "main" }
kube = { version = "4.2", default-features = false, features = ["client", "config", "rustls-tls"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
jiff = "0.2"
