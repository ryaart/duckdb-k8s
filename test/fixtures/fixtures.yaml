# Seed objects for tests. There is no kubelet or controller-manager, so statuses are
# written by test/fixtures/status.sh through the status subresource.
apiVersion: v1
kind: Namespace
metadata: { name: shop }
---
apiVersion: v1
kind: Pod
metadata: { name: web-1, namespace: shop, labels: { app: web, tier: frontend } }
spec: { nodeName: node-1, containers: [ { name: web, image: "nginx:1.27" } ] }
---
apiVersion: v1
kind: Pod
metadata: { name: web-2, namespace: shop, labels: { app: web, tier: frontend } }
spec:
  nodeName: node-1
  containers: [ { name: web, image: "nginx:1.27" }, { name: sidecar, image: "envoyproxy/envoy:v1.33" } ]
---
apiVersion: v1
kind: Pod
metadata: { name: db-1, namespace: shop, labels: { app: db, tier: backend } }
spec: { containers: [ { name: postgres, image: "postgres:17" } ] }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: settings, namespace: default }
data: { mode: test }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: shop }
spec:
  replicas: 2
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec: { containers: [ { name: api, image: "ghcr.io/acme/api:2.1" } ] }
---
apiVersion: v1
kind: Node
metadata: { name: node-1, labels: { node-role.kubernetes.io/control-plane: "", node-role.kubernetes.io/worker: "" } }
---
apiVersion: v1
kind: Node
metadata: { name: node-2 }
spec: { unschedulable: true }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: shop }
spec: { selector: { app: web }, ports: [ { port: 80 } ] }
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: shop }
spec: { type: NodePort, selector: { app: api }, ports: [ { port: 8080, nodePort: 30080, protocol: TCP } ] }
---
apiVersion: v1
kind: Event
metadata: { name: web-2.backoff, namespace: shop }
involvedObject: { kind: Pod, name: web-2, namespace: shop }
type: Warning
reason: BackOff
message: Back-off restarting failed container web
count: 12
firstTimestamp: "2026-09-29T10:00:00Z"
lastTimestamp: "2026-09-29T10:30:00Z"
source: { component: kubelet }
---
apiVersion: v1
kind: Event
metadata: { name: web-1.scheduled, namespace: shop }
involvedObject: { kind: Pod, name: web-1, namespace: shop }
type: Normal
reason: Scheduled
message: Successfully assigned shop/web-1 to node-1
firstTimestamp: "2026-09-29T09:00:00Z"
lastTimestamp: "2026-09-29T09:00:00Z"
source: { component: default-scheduler }
